# Builds and tests the Release profile: the Kazo OS packages from nuget.org, at the version of the
# submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
#
# The `guest` tests (a real browser booting the Alpine test image) run in guest-tests.yml, on the
# paths that touch the engine, nightly and on demand (plan section 11).
name: CI

on:
  push:
    branches: [main, j0/base]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the Kazo OS submodule
        run: bash .github/scripts/check-kazoos-submodule.sh

      - name: Check the vendored v86 (same bytes as a fresh download, patches applied)
        run: python3 -I tools/v86/vendor-v86.py --check

      - name: Build (Release, packages)
        run: dotnet build OsX86.sln -c Release -warnaserror

      - name: Unit tests with coverage (80 % of lines on the C# of OsX86 and OsX86.Feature)
        run: >
          dotnet test OsX86.sln -c Release --no-build --filter "Category!=guest"
          -p:CollectCoverage=true "-p:Include=[OsX86]*%2c[OsX86.Feature]*"
          -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total
