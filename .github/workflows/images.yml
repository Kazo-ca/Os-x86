# The guest images (milestone 0, work item 4; decisions 201 A, 202 A, 210 A): built by the CI
# from the recipes of images/ whenever they change, never committed. Each job builds one image
# with images/tools/pack-image.py (chunks of 32 MiB, manifest format 1, manifest.sha256) and
# keeps the pack as a workflow artifact. linux-base also runs the image test of 210 A
# (images/tools/image-check.py) and fails when one of the 22 R134.5 checks breaks. The guest
# agent of work item 5 (images/agent, a static musl i386 binary) is built, checked and driven
# in a container by the `agent` job; alpine-test and linux-base build it again to install it.
#
# Publication (plan section 12, decision 202 A), on a push to j0/base or main only:
#   - the small test images (alpine-test, freedos: manifests, chunks, sources) go to GitHub
#     Pages when the repository variable OSX86_PUBLISH_PAGES is "true" (Pages must first be
#     enabled by the maintainer with the source "GitHub Actions"); nothing above 100 MiB ever
#     goes there, the job refuses it;
#   - the real images (linux-base, later the Wine image) go to Cloudflare R2 behind a Kazo
#     domain when the repository variable OSX86_R2_BUCKET and the three OSX86_R2_* secrets are
#     set; until Kazo provides the origin (202 A) the job never runs. The wine image (work item
#     9) is built only when its inputs change and kept as the artifact pack-wine, outside the
#     image-* pattern of the R2 job: not published by this workflow yet.
# Layout on both hosts: images/<image>/<version>/{manifest.json, manifest.sha256, chunk-NNNNN.bin,
# sources.json, ...} and images/index.json.
name: Images

on:
  pull_request:
    paths:
      - "images/**"
      - "tests/OsX86.Tests/Images/**"
      - ".github/workflows/images.yml"
      - ".github/scripts/repair-i386-seccomp.sh"
      # The guest job below boots linux-base and FreeDOS: the engine and its tests trigger it too.
      - "src/OsX86/Engine/**"
      - "src/OsX86/Storage/**"
      - "src/OsX86/wwwroot/engine/**"
      - "tests/OsX86.Tests/Guest/**"
  push:
    branches: [j0/base, main]
    paths:
      - "images/**"
      - "tests/OsX86.Tests/Images/**"
      - ".github/workflows/images.yml"
      - ".github/scripts/repair-i386-seccomp.sh"
      - "src/OsX86/Engine/**"
      - "src/OsX86/Storage/**"
      - "src/OsX86/wwwroot/engine/**"
      - "tests/OsX86.Tests/Guest/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14" # compression.zstd in the standard library

jobs:
  agent:
    # The guest agent (205 A): compiled with -Werror in the pinned Alpine i386 stage, checked
    # (static ELF32 i386, sizes, sources), then driven over its protocol in a container.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Repair the socket rule of the daemon's seccomp profile for 32-bit containers
        run: bash .github/scripts/repair-i386-seccomp.sh
      - name: Build, check and smoke-test the agent
        run: python3 -I images/agent/build-agent.py --smoke
      - name: Check the build again from its manifest
        run: python3 -I images/agent/build-agent.py --check

  alpine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Repair the socket rule of the daemon's seccomp profile for 32-bit containers
        run: bash .github/scripts/repair-i386-seccomp.sh
      - name: Build the guest agent (Docker linux/386)
        run: python3 -I images/agent/build-agent.py
      - name: Build and pack the Alpine test image (official ISO, verified) with the agent
        run: python3 -I images/alpine-test/build-alpine-test.py --require-agent
      - name: Check the pack
        run: python3 -I images/tools/pack-image.py check images/build/alpine-test/pack
      - uses: actions/upload-artifact@v4
        with:
          name: image-alpine-test
          path: images/build/alpine-test/pack
          if-no-files-found: error

  freedos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install mtools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mtools
      - name: Build and pack the FreeDOS image (official archive, verified)
        run: python3 -I images/freedos/build-freedos.py
      - name: Check the pack
        run: python3 -I images/tools/pack-image.py check images/build/freedos/pack
      - uses: actions/upload-artifact@v4
        with:
          name: image-freedos
          path: images/build/freedos/pack
          if-no-files-found: error

  linux-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Repair the socket rule of the daemon's seccomp profile for 32-bit containers
        run: bash .github/scripts/repair-i386-seccomp.sh
      - name: Build linux-base (Docker linux/386), image test of 210 A, ext4 root, sources, pack
        run: python3 -I images/linux-base/build-linux-base.py
      - name: Check the pack
        run: python3 -I images/tools/pack-image.py check images/build/linux-base/pack
      - name: Sizes
        run: cat images/build/linux-base/measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-linux-base
          path: images/build/linux-base/pack
          if-no-files-found: error

  guest:
    # Work item 6a: the packs built above, downloaded as they are (never built twice), booted in
    # the engine worker of a headless Chromium from the OPFS: linux-base to OSX86-READY with its
    # agent, the 22 R134.5 checks at run time, the write layer persistent then discarded; FreeDOS
    # to its prompt. OSX86_REQUIRE_PACKS makes a missing pack a failure, not a skip.
    needs: [linux-base, freedos]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: image-linux-base
          path: images/build/linux-base/pack
      - uses: actions/download-artifact@v4
        with:
          name: image-freedos
          path: images/build/freedos/pack
      - name: Build (Release, packages)
        run: dotnet build OsX86.sln -c Release
      - name: Install the Playwright browser
        run: pwsh tests/OsX86.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Guest tests of the packed images (linux-base, FreeDOS)
        env:
          OSX86_REQUIRE_PACKS: "1"
        run: >
          dotnet test OsX86.sln -c Release --no-build --logger "console;verbosity=normal"
          --filter "Category=guest&(FullyQualifiedName~LinuxBaseGuestTests|FullyQualifiedName~FreeDosGuestTests)"

  wine-changes:
    # The wine image takes a long build (WineHQ packages, Mono, Gecko, template prefix, ext4 of
    # about 1.3 GiB, zstd 19): it is built only when its recipe, the linux-base it starts from, its
    # guest test or this workflow change (or on a manual run).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wine: ${{ steps.diff.outputs.wine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo wine=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then range="origin/$BASE_REF...HEAD"; else range="$BEFORE..HEAD"; fi
          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then echo wine=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -q -E '^(images/wine/|images/linux-base/|tests/OsX86\.Tests/Guest/WineGuestTests\.cs$|\.github/workflows/images\.yml$)'; then
            echo wine=true >> "$GITHUB_OUTPUT"
          else
            echo wine=false >> "$GITHUB_OUTPUT"
          fi

  wine:
    # Work item 9: the wine image (Debian i386 + WineHQ 11.0 + Mono + Gecko + template prefix +
    # hot files), its image test of 210 A, sources.json, pack. Kept as the artifact pack-wine
    # (not image-*: the R2 job publishes image-* artifacts, and the first publication of the wine
    # image must carry the sources of Wine, Mono and Gecko, --fetch-sources); never on Pages.
    needs: wine-changes
    if: needs.wine-changes.outputs.wine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the build needs about 9 GB; this job uses no .NET, Android or Haskell)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Repair the socket rule of the daemon's seccomp profile for 32-bit containers
        run: bash .github/scripts/repair-i386-seccomp.sh
      - name: Build the wine image (docker run + commit, linux/386), image test of 210 A, ext4, sources, pack
        run: python3 -I images/wine/build-wine.py
      - name: Check the pack
        run: python3 -I images/tools/pack-image.py check images/build/wine/pack
      - name: Sizes and hot files
        run: cat images/build/wine/measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: pack-wine
          path: images/build/wine/pack
          if-no-files-found: error

  guest-wine:
    # Work item 9: the wine pack booted from the OPFS (the path of work item 6a); the agent answers;
    # `wine cmd /c echo` and the console program of the recipe run through exec-in-prefix on a copy
    # of the template prefix, with and without the preloading; the times are printed.
    needs: wine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: pack-wine
          path: images/build/wine/pack
      - name: Build (Release, packages)
        run: dotnet build OsX86.sln -c Release
      - name: Install the Playwright browser
        run: pwsh tests/OsX86.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Guest test of the wine image
        env:
          OSX86_REQUIRE_PACKS: "1"
        run: >
          dotnet test OsX86.sln -c Release --no-build --logger "console;verbosity=normal"
          --filter "Category=guest&FullyQualifiedName~WineGuestTests"

  image-tool-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build
        run: dotnet build tests/OsX86.Tests/OsX86.Tests.csproj -c Release -warnaserror
      - name: Unit tests of the image tools
        run: dotnet test tests/OsX86.Tests/OsX86.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~OsX86.Tests.Images&Category=unit"

  publish-pages:
    # The small test images on GitHub Pages (202 A). Needs Pages enabled with the source
    # "GitHub Actions" (a repository setting) and the variable OSX86_PUBLISH_PAGES set to true.
    if: github.event_name != 'pull_request' && vars.OSX86_PUBLISH_PAGES == 'true'
    needs: [alpine-test, freedos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: image-alpine-test
          path: packs/alpine-test
      - uses: actions/download-artifact@v4
        with:
          name: image-freedos
          path: packs/freedos
      - name: Lay the site out and refuse anything above 100 MiB
        run: python3 -I images/tools/publish-layout.py --packs packs --site site --max-file-bytes 104857600 --max-total-bytes 943718400
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-r2:
    # The real images on Cloudflare R2 behind a Kazo domain (202 A). Never runs until Kazo
    # provides the bucket (variable OSX86_R2_BUCKET) and the credentials (secrets
    # OSX86_R2_ACCOUNT_ID, OSX86_R2_ACCESS_KEY_ID, OSX86_R2_SECRET_ACCESS_KEY). Objects are
    # immutable (versioned paths); the bucket's CORS policy must expose Content-Range, ETag and
    # Content-Length (trial E3).
    if: github.event_name != 'pull_request' && vars.OSX86_R2_BUCKET != ''
    needs: [alpine-test, freedos, linux-base]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: packs
      - name: Lay the publication out (no size limit on R2)
        run: |
          for pack in packs/image-*; do mv "$pack" "packs/${pack#packs/image-}"; done
          python3 -I images/tools/publish-layout.py --packs packs --site site
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rclone
      - name: Upload to R2 (immutable, versioned paths)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.OSX86_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.OSX86_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.OSX86_R2_SECRET_ACCESS_KEY }}
        run: |
          rclone copy site "r2:${{ vars.OSX86_R2_BUCKET }}" --checksum --exclude images/index.json             --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copyto site/images/index.json "r2:${{ vars.OSX86_R2_BUCKET }}/images/index.json"             --header-upload "Cache-Control: no-cache"
