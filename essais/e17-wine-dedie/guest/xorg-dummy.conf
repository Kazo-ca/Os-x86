# Essai E17 — pilote « dummy » (rien n'est dessiné sur le VGA ; sert à comparer la géométrie des fenêtres).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "ServerLayout"
    Identifier "v86"
    Screen 0 "Screen0"
    InputDevice "kbd" "CoreKeyboard"
    InputDevice "mouse" "CorePointer"
EndSection

Section "InputDevice"
    Identifier "kbd"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 16384
EndSection

Section "Monitor"
    Identifier "mon"
    HorizSync 30-70
    VertRefresh 50-75
    Modeline "1024x768" 63.5 1024 1072 1176 1328 768 771 775 798 -hsync +vsync
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "dummy"
    Monitor "mon"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768"
    EndSubSection
EndSection
