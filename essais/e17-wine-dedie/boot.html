<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>E17 — Wine dédié dans v86</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; background: #1b1b1b; color: #ddd; }
  #screen_container { display: inline-block; border: 1px solid #555; background: #000; vertical-align: top; }
  #screen_container > div { white-space: pre; font: 14px monospace; line-height: 14px; color: #ccc; }
  #serial { height: 320px; overflow: auto; background: #000; color: #8f8; padding: 6px; font: 12px monospace; white-space: pre-wrap; border: 1px solid #555; }
  #marks { font: 12px monospace; }
  button, input { margin: 2px; }
  .row { margin: 6px 0; }
</style>
<script src="lib/libv86.js"></script>
<body>
<h3>E17 — Wine dédié dans v86 <small id="status">(chargement…)</small></h3>
<div class="row">
  <button id="btn_bench">Lancer le bench (Xorg fbdev)</button>
  <button id="btn_save">Save state</button>
  <button id="btn_restore" disabled>Restore state</button>
  <button id="btn_upload" disabled>Envoyer l'état au serveur</button>
  <label>Charger un état : <input id="file_state" type="file"></label>
</div>
<div class="row">
  <input id="serial_in" size="60" placeholder="commande pour la console série (Entrée pour envoyer)">
</div>
<div id="screen_container">
  <div></div>
  <canvas style="display: none"></canvas>
</div>
<pre id="serial"></pre>
<div id="marks"></div>
<script>
"use strict";
// Essai E17 — page de boot (dérivée de E1/E4). Paramètres d'URL :
//   ?fs=stable-fs.json (défaut) | devel-fs.json | alpine-fs.json (image E1, servie par le repli du serveur)
//   ?flat=rootfs-flat (défaut) | alpine-rootfs-flat (E1)
//   ?state=<fichier dans images/>  ?mem=1024
// Tout l'état de mesure est exposé dans window.E17 pour drive.mjs / run.mjs.
const E17 = window.E17 = {
  t0: performance.now(),
  params: Object.fromEntries(new URLSearchParams(location.search)),
  marks: [], info: [], events: [], serial: "",
  state: null, lastSave: null, lastRestore: null, emu: null,
};
const memMiB = Number(E17.params.mem || 1024);
const fsName = E17.params.fs || "stable-fs.json";
const flatDir = E17.params.flat || "rootfs-flat";
const config = {
  wasm_path: "lib/v86.wasm",
  memory_size: memMiB * 1024 * 1024,
  vga_memory_size: 8 * 1024 * 1024,
  screen_container: document.getElementById("screen_container"),
  bios: { url: "lib/seabios.bin" },
  vga_bios: { url: "lib/vgabios.bin" },
  filesystem: { baseurl: "images/" + flatDir + "/", basefs: "images/" + fsName },
  autostart: true,
  bzimage_initrd_from_filesystem: true,
  cmdline: "rw root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose modules=virtio_pci console=ttyS0 tsc=reliable mitigations=off",
  disable_speaker: true,
};
if (E17.params.state) config.initial_state = { url: "images/" + E17.params.state };

const emu = E17.emu = new V86(config);
// v86 : read_file / create_file prennent un chemin SANS barre oblique initiale (E4).
const _readFile = emu.read_file.bind(emu), _createFile = emu.create_file.bind(emu);
emu.read_file = (p) => _readFile(p.replace(/^\/+/, ""));
emu.create_file = (p, d) => _createFile(p.replace(/^\/+/, ""), d);
for (const ev of ["emulator-ready", "emulator-started", "emulator-stopped", "download-error"]) {
  emu.add_listener(ev, () => { E17.events.push({ name: ev, t: performance.now() }); setStatus(ev); });
}

const serialEl = document.getElementById("serial");
const marksEl = document.getElementById("marks");
let line = "";
let promptSeen = false;
function setStatus(s) { document.getElementById("status").textContent = "(" + s + ")"; }
function addMark(name, uptime) {
  const m = { name, uptime: Number(uptime), t: performance.now() };
  E17.marks.push(m);
  marksEl.textContent += `${name.padEnd(18)} t=${(m.t / 1000).toFixed(2)}s uptime=${uptime}\n`;
}
emu.add_listener("serial0-output-byte", (byte) => {
  const c = String.fromCharCode(byte);
  E17.serial += c;
  serialEl.textContent += c;
  if (serialEl.textContent.length > 200000) serialEl.textContent = serialEl.textContent.slice(-100000);
  serialEl.scrollTop = serialEl.scrollHeight;
  if (c === "\n") {
    const l = line.trim();
    line = "";
    const mm = /^MARK (\S+)(?: (\S+))?$/.exec(l);
    if (mm) addMark(mm[1], mm[2] || "0");
    else if (/^(MEM|WIN|WINEVER|X |PREFIX_KB) /.test(l)) E17.info.push({ line: l, t: performance.now() });
  } else if (c !== "\r") {
    line += c;
  }
  if (!promptSeen && c === " " && /[\n\r][\w().-]*:~# $/.test(E17.serial.slice(-40))) { promptSeen = true; addMark("shell-prompt", "0"); }
});

E17.send = (text) => emu.serial0_send(text);
E17.bench = (mode, progs = "") => { promptSeen = true; emu.serial0_send(`sh /root/bench.sh ${mode} ${progs}\n`); };
E17.readText = async (p) => new TextDecoder().decode(await emu.read_file(p));
E17.writeFile = (p, text) => emu.create_file(p, new TextEncoder().encode(text));
E17.writeBytesB64 = (p, b64) => emu.create_file(p, Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
E17.saveState = async () => {
  const t = performance.now();
  const s = await emu.save_state();
  E17.state = s;
  E17.lastSave = { ms: performance.now() - t, bytes: s.byteLength };
  for (const id of ["btn_restore", "btn_upload"]) document.getElementById(id).disabled = false;
  setStatus(`état sauvegardé : ${(s.byteLength / 1048576).toFixed(1)} MiB en ${E17.lastSave.ms.toFixed(0)} ms`);
  return E17.lastSave;
};
E17.restoreState = async (buf = E17.state) => {
  const t = performance.now();
  await emu.stop();
  await emu.restore_state(buf);
  emu.run();
  E17.lastRestore = { ms: performance.now() - t, bytes: buf.byteLength };
  setStatus(`état restauré en ${E17.lastRestore.ms.toFixed(0)} ms`);
  return E17.lastRestore;
};
E17.uploadState = async (name = "state.bin") => {
  const CHUNK = 32 * 1048576;  // envoi par morceaux (E1 : un seul fetch de 600 Mo a tué le renderer)
  let r;
  for (let off = 0; off < E17.state.byteLength; off += CHUNK) {
    r = await fetch(`/__state/${name}?offset=${off}`, { method: "PUT", body: E17.state.slice(off, Math.min(off + CHUNK, E17.state.byteLength)) });
    if (!r.ok) throw new Error("upload: " + r.status);
  }
  return r.text();
};
E17.dropState = () => { E17.state = null; };
E17.measureMemory = async () => {
  if (!performance.measureUserAgentSpecificMemory) return { unsupported: true, crossOriginIsolated };
  try { return await performance.measureUserAgentSpecificMemory(); } catch (e) { return { error: String(e) }; }
};

document.getElementById("btn_bench").onclick = () => E17.bench("xorg");
document.getElementById("btn_save").onclick = () => E17.saveState();
document.getElementById("btn_restore").onclick = () => E17.restoreState();
document.getElementById("btn_upload").onclick = async () => setStatus("envoyé : " + await E17.uploadState() + " octets");
document.getElementById("file_state").onchange = async function () {
  if (!this.files.length) return;
  await E17.restoreState(await this.files[0].arrayBuffer());
  this.value = "";
};
document.getElementById("serial_in").onkeydown = function (e) {
  if (e.key === "Enter") { emu.serial0_send(this.value + "\n"); this.value = ""; }
  e.stopPropagation();
};
</script>
</body>
</html>
