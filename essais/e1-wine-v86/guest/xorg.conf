# Xorg sans udev dans v86 : périphériques explicites.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "ServerLayout"
    Identifier "v86"
    Screen 0 "Screen0"
    InputDevice "kbd" "CoreKeyboard"
    InputDevice "mouse" "CorePointer"
EndSection

Section "InputDevice"
    Identifier "kbd"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

Section "Device"
    Identifier "vga"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "vga"
    # bochs-drm expose un fb 1024x768 32 bpp : on prend le mode natif (depth 24).
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection
